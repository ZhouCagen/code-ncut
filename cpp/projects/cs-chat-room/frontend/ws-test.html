<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>WebSocket Test</title>
  </head>
  <body>
    <h1>WebSocket Test</h1>

    <script>
      const ws = new WebSocket("ws://127.0.0.1:2006");

      ws.onopen = () => {
        console.log("connected");
      };

      ws.onerror = (event) => {
        console.log("error", event);
      };

      ws.onclose = (event) => {
        console.log("closed", event);
      };

      window.ws = ws;
    </script>
  </body>
</html>
