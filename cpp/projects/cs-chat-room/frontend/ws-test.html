<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>WebSocket Test</title>
    <style>
      body {
        font-family: sans-serif;
        max-width: 800px;
        margin: 40px auto;
        background: #111827;
        color: #e5e7eb;
      }

      h1 {
        font-size: 28px;
      }

      .row {
        display: flex;
        gap: 8px;
        margin-bottom: 12px;
      }

      input {
        flex: 1;
        padding: 10px;
        border-radius: 6px;
        border: 1px solid #374151;
        background: #1f2937;
        color: #e5e7eb;
      }

      button {
        padding: 10px 14px;
        border: none;
        border-radius: 6px;
        background: #2563eb;
        color: white;
        cursor: pointer;
      }

      button:hover {
        background: #1d4ed8;
      }

      button.danger {
        background: #dc2626;
      }

      button.danger:hover {
        background: #b91c1c;
      }

      #status {
        margin-bottom: 12px;
        font-weight: bold;
      }

      #log {
        height: 420px;
        overflow-y: auto;
        padding: 12px;
        border: 1px solid #374151;
        border-radius: 8px;
        background: #030712;
        white-space: pre-wrap;
      }

      .hint {
        color: #9ca3af;
        font-size: 14px;
        margin-bottom: 16px;
      }
    </style>
  </head>
  <body>
    <h1>WebSocket Test</h1>

    <div class="hint">
      地址默认是 ws://127.0.0.1:2006。可以开两个浏览器标签页测试广播。
    </div>

    <div id="status">状态：未连接</div>

    <div class="row">
      <input id="urlInput" value="ws://127.0.0.1:2006" />
      <button onclick="connectWebSocket()">连接</button>
      <button class="danger" onclick="disconnectWebSocket()">断开</button>
    </div>

    <div class="row">
      <input id="messageInput" placeholder="输入消息，回车发送" />
      <button onclick="sendMessage()">发送</button>
    </div>

    <div id="log"></div>

    <script>
      let socket = null;

      const statusElement = document.getElementById("status");
      const logElement = document.getElementById("log");
      const urlInput = document.getElementById("urlInput");
      const messageInput = document.getElementById("messageInput");

      function log(message) {
        const time = new Date().toLocaleTimeString();
        logElement.textContent += `[${time}] ${message}\n`;
        logElement.scrollTop = logElement.scrollHeight;
      }

      function setStatus(message) {
        statusElement.textContent = `状态：${message}`;
      }

      function connectWebSocket() {
        if (socket && socket.readyState === WebSocket.OPEN) {
          log("已经连接了");
          return;
        }

        const url = urlInput.value.trim();
        socket = new WebSocket(url);

        socket.addEventListener("open", () => {
          setStatus("已连接");
          log(`连接成功：${url}`);
        });

        socket.addEventListener("message", (event) => {
          log(`收到：${event.data}`);
        });

        socket.addEventListener("close", () => {
          setStatus("已断开");
          log("连接关闭");
        });

        socket.addEventListener("error", () => {
          setStatus("连接错误");
          log("WebSocket 错误");
        });
      }

      function disconnectWebSocket() {
        if (!socket) {
          log("当前没有 socket");
          return;
        }

        socket.close();
        socket = null;
      }

      function sendMessage() {
        const message = messageInput.value;

        if (!socket || socket.readyState !== WebSocket.OPEN) {
          log("还没连接，不能发送");
          return;
        }

        if (message.length === 0) {
          log("消息为空，不发送");
          return;
        }

        socket.send(message);
        log(`发送：${message}`);
        messageInput.value = "";
        messageInput.focus();
      }

      messageInput.addEventListener("keydown", (event) => {
        if (event.key === "Enter") {
          sendMessage();
        }
      });
    </script>
  </body>
</html>
